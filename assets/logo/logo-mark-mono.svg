<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-label="おれんじさん ロゴマーク(単色)">
  <!-- 単色版:スタンプ・印刷・ファビコンなど1色で使う場面向け。fill を任意の色に変更可 -->
  <g fill="#F07818">
    <!-- オレンジの実(ハート+クロスを白抜き) -->
    <path fill-rule="evenodd" d="
      M128 56 a94 94 0 1 0 0.0001 0 Z
      M128 196 C 116 185, 88 165, 88 142 C 88 126, 100 116, 113 116
      C 120 116, 126 120, 128 126 C 130 120, 136 116, 143 116
      C 156 116, 168 126, 168 142 C 168 165, 140 185, 128 196 Z"/>
    <!-- クロス -->
    <rect x="122" y="128" width="12" height="42" rx="4"/>
    <rect x="107" y="143" width="42" height="12" rx="4"/>
    <!-- 枝 -->
    <path d="M128 58 C128 44 136 34 150 28" fill="none"
          stroke="#F07818" stroke-width="10" stroke-linecap="round"/>
    <!-- 葉 -->
    <path d="M150 34 C156 12 182 2 206 12 C202 36 178 50 154 44 C151 43 149 39 150 34 Z"/>
  </g>
</svg>
