<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-label="おれんじさん ロゴマーク">
  <defs>
    <linearGradient id="orangeGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFB65C"/>
      <stop offset="1" stop-color="#F07818"/>
    </linearGradient>
    <linearGradient id="leafGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8CC152"/>
      <stop offset="1" stop-color="#5FA33C"/>
    </linearGradient>
  </defs>

  <!-- オレンジの実 -->
  <circle cx="128" cy="150" r="94" fill="url(#orangeGrad)"/>

  <!-- ハイライト -->
  <ellipse cx="94" cy="112" rx="30" ry="18" fill="#FFFFFF" opacity="0.30"
           transform="rotate(-28 94 112)"/>

  <!-- 枝 -->
  <path d="M128 58 C128 44 136 34 150 28" fill="none"
        stroke="#8B5E3C" stroke-width="10" stroke-linecap="round"/>

  <!-- 葉 -->
  <path d="M150 34 C156 12 182 2 206 12 C202 36 178 50 154 44 C151 43 149 39 150 34 Z"
        fill="url(#leafGrad)"/>
  <path d="M154 40 C168 32 184 24 198 18" fill="none"
        stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" opacity="0.5"/>

  <!-- ハート(ケアの心) -->
  <path d="M128 196
           C 116 185, 88 165, 88 142
           C 88 126, 100 116, 113 116
           C 120 116, 126 120, 128 126
           C 130 120, 136 116, 143 116
           C 156 116, 168 126, 168 142
           C 168 165, 140 185, 128 196 Z"
        fill="#FFFFFF"/>

  <!-- クロス(看護) -->
  <g fill="#F07818">
    <rect x="122" y="128" width="12" height="42" rx="4"/>
    <rect x="107" y="143" width="42" height="12" rx="4"/>
  </g>
</svg>
